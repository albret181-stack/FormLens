name: Publish and verify signed update
on:
  push:
    branches: ['feat/native-macos-updates']
    paths: ['config/prepared-release.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-signed-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read signed release request
        run: |
          node - <<'JS'
          const fs=require('fs'),m=require('./config/prepared-release.json');
          if(!/^\d+\.\d+\.\d+$/.test(m.version)||!Number.isSafeInteger(m.runId)||m.runId<=0||m.artifactName!=='FormLens-production-update')throw Error('Invalid request');
          fs.appendFileSync(process.env.GITHUB_ENV,`VERSION=${m.version}\nPREPARE_RUN=${m.runId}\n`);
          JS
      - name: Retrieve the exact archive signed offline
        run: gh run download "$PREPARE_RUN" --repo "$GITHUB_REPOSITORY" --name FormLens-production-update --dir artifacts
      - name: Verify ZIP and feed signatures using the pinned public key
        run: node scripts/verify-prepared-release.mjs
      - name: Publish prerelease for native installation verification
        run: |
          if gh release view "v$VERSION" --json isDraft,isPrerelease > release-state.json 2>/dev/null; then
            node -e "const r=require('./release-state.json');if(!r.isDraft&&!r.isPrerelease)throw Error('Refusing to replace a public release')"
            gh release upload "v$VERSION" artifacts/FormLens-* artifacts/appcast.xml artifacts/SHA256SUMS.txt --clobber
          else
            gh release create "v$VERSION" artifacts/FormLens-* artifacts/appcast.xml artifacts/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "FormLens $VERSION" --notes-file RELEASE_NOTES.md
          fi
      - name: Verify installed 0.9 updates, relaunches and preserves its stored project
        run: node scripts/verify-installed-update.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-update-cli-evidence
          path: evidence/
          if-no-files-found: ignore

  bell:
    needs: publish
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read verified release version
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV,'VERSION='+require('./config/prepared-release.json').version+'\n')"
      - name: Make the verified release available through the bell
        id: promote
        run: gh release edit "v$VERSION" --draft=false --prerelease=false --latest
      - name: Verify real bell buttons on a fresh Mac with its own profile
        run: node scripts/verify-installed-update.mjs --bell
      - name: Withdraw from the update channel if the bell verification fails
        if: failure() && steps.promote.outcome == 'success'
        run: gh release edit "v$VERSION" --prerelease --latest=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-update-bell-evidence
          path: evidence/
          if-no-files-found: ignore
